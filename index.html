
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15100c">
<title>طلبك جاهز ☕</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#15100c;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{text-align:center;padding:26px 12px;background:#241b15}
h1{color:#e8bd83;margin:0 0 8px}
header p{color:#c4b4a3;font-size:14px}
main{max-width:650px;margin:auto;padding:18px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:13px}
.tabs button{flex:1;background:#35271e;color:#fff}
.tabs button.active{background:#c99558;color:#17100b;font-weight:bold}
.card{background:#241b15;border:1px solid #4c3728;border-radius:18px;padding:20px;margin-bottom:16px}
h2{color:#e8bd83;font-size:20px;margin-top:0}
input{width:100%;padding:13px;border:1px solid #765b43;border-radius:10px;background:#17110e;color:white;margin:8px 0}
.primary{background:#c99558;color:#17100b;font-weight:bold;width:100%}
.ready{background:#33875a;color:white}
.small{font-size:13px;color:#c4b4a3}
.order{border-top:1px solid #554031;padding:15px 0}
.number{font-size:32px;font-weight:bold;color:#e8bd83}
.status{padding:12px;border-radius:10px;background:#44321f;margin:12px 0}
.done{background:#174d32;color:#b8f3ce}
#qr{display:block;margin:20px auto;max-width:220px;width:100%;background:white;padding:10px;border-radius:12px}
a{color:#e8bd83}
.hidden{display:none}
.error{color:#ffb1a6}
</style>
</head>
<body>
<header>
<h1>طلبك جاهز ☕</h1>
<p>تابع طلبك بكل سهولة ومن دون تسجيل</p>
</header>
<main>
<div class="tabs" id="tabs">
<button id="staffTab" onclick="showPage('staff')">لوحة الكافيه</button>
<button id="customerTab" onclick="showPage('customer')">صفحة العميل</button>
</div>

<section id="staff" class="hidden">
<div class="card" id="loginCard">
<h2>دخول الموظف</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button class="primary" onclick="login()">دخول</button>
<p id="loginMsg" class="small"></p>
</div>

<div id="staffPanel" class="hidden">
<div class="card">
<h2>إدارة الطلبات</h2>
<button class="primary" onclick="newOrder()">+ إنشاء طلب جديد</button>
<p class="small">يظهر رمز QR بعد إنشاء الطلب</p>
<button onclick="logout()">تسجيل الخروج</button>
</div>
<div class="card hidden" id="newOrderCard">
<h2>رمز الطلب الجديد</h2>
<div class="number" id="newNumber"></div>
<img id="qr" alt="رمز QR للطلب">
<p class="small">العميل يصوّر الرمز ويفتح صفحة طلبه مباشرة</p>
<a id="orderLink" target="_blank">فتح رابط الطلب</a>
</div>
<div class="card">
<h2>الطلبات</h2>
<div id="orders">جارٍ التحميل...</div>
</div>
</div>
</section>

<section id="customer" class="hidden">
<div class="card">
<h2>متابعة طلبك</h2>
<div id="customerOrder"></div>
</div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getFirestore,collection,doc,addDoc,getDoc,updateDoc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyDS6Sx7FNZPisOe48xKpr0LfVujpn9NpxM",
 authDomain:"talabak-jahiz-ba884.firebaseapp.com",
 projectId:"talabak-jahiz-ba884",
 storageBucket:"talabak-jahiz-ba884.firebasestorage.app",
 messagingSenderId:"328520935117",
 appId:"1:328520935117:web:96c8d056b218855735ab84",
 measurementId:"G-JK18QQ6XMP"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const ordersRef=collection(db,"orders");
let stopOrders=null;
let stopCustomer=null;

const el=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const orderId=params.get("order");

window.showPage=function(page){
 el("staff").classList.toggle("hidden",page!=="staff");
 el("customer").classList.toggle("hidden",page!=="customer");
 el("staffTab").classList.toggle("active",page==="staff");
 el("customerTab").classList.toggle("active",page==="customer");
};

window.login=async function(){
 try{
  el("loginMsg").textContent="جارٍ الدخول...";
  await signInWithEmailAndPassword(auth,el("email").value.trim(),el("password").value);
  el("loginMsg").textContent="";
 }catch(e){
  el("loginMsg").textContent="تعذّر الدخول، تأكد من البريد وكلمة المرور";
 }
};

window.logout=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
 el("loginCard").classList.toggle("hidden",!!user);
 el("staffPanel").classList.toggle("hidden",!user);
 if(stopOrders){stopOrders();stopOrders=null;}
 if(user){
  stopOrders=onSnapshot(query(ordersRef,orderBy("createdAt","desc")),snapshot=>{
   const box=el("orders");
   box.replaceChildren();
   if(snapshot.empty){box.textContent="ما فيه طلبات حتى الآن";return;}
   snapshot.forEach(item=>{
    const data=item.data();
    const row=document.createElement("div");
    row.className="order";
    const title=document.createElement("div");
    title.textContent="طلب رقم "+(data.number||item.id.slice(0,6));
    title.className="number";
    row.appendChild(title);
    const status=document.createElement("div");
    status.className="status"+(data.status==="ready"?" done":"");
    status.textContent=data.status==="ready"?"✅ جاهز للاستلام":"⏳ قيد التحضير";
    row.appendChild(status);
    if(data.status!=="ready"){
     const btn=document.createElement("button");
     btn.className="ready";
     btn.textContent="الطلب جاهز";
     btn.onclick=()=>markReady(item.id);
     row.appendChild(btn);
    }
    box.appendChild(row);
   });
  },()=>el("orders").textContent="تعذّر تحميل الطلبات. راجع صلاحيات قاعدة البيانات.");
 }
});

window.newOrder=async function(){
 if(!auth.currentUser)return;
 try{
  const number=String(Date.now()).slice(-6);
  const result=await addDoc(ordersRef,{
   number,
   status:"preparing",
   createdAt:serverTimestamp(),
   owner:auth.currentUser.uid
  });
  const url=new URL(location.href);
  url.search="?order="+encodeURIComponent(result.id);
  el("newOrderCard").classList.remove("hidden");
  el("newNumber").textContent=number;
  el("orderLink").href=url.href;
  el("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(url.href);
 }catch(e){alert("تعذّر إنشاء الطلب. تأكد من قواعد Firestore.");}
};

async function markReady(id){
 try{await updateDoc(doc(db,"orders",id),{status:"ready"});}
 catch(e){alert("تعذّر تحديث الطلب.");}
}

function watchCustomer(id){
 el("customerOrder").textContent="جارٍ تحميل الطلب...";
 stopCustomer=onSnapshot(doc(db,"orders",id),snapshot=>{
  const box=el("customerOrder");
  box.replaceChildren();
  if(!snapshot.exists()){
   box.textContent="الطلب غير موجود أو انتهت صلاحيته";
   return;
  }
  const data=snapshot.data();
  const title=document.createElement("div");
  title.className="number";
  title.textContent="رقم "+data.number;
  const status=document.createElement("div");
  status.className="status"+(data.status==="ready"?" done":"");
  status.textContent=data.status==="ready"?"✅ طلبك جاهز للاستلام!":"☕ طلبك قيد التحضير";
  box.append(title,status);
  const note=document.createElement("p");
  note.className="small";
  note.textContent="تتحدث الحالة تلقائيًا ما دامت الصفحة مفتوحة";
  box.appendChild(note);
 },()=>{
  el("customerOrder").textContent="تعذّر عرض الطلب. راجع اتصال الإنترنت وصلاحيات القراءة.";
 });
}

if(orderId){
 el("tabs").classList.add("hidden");
 showPage("customer");
 watchCustomer(orderId);
}else{
 showPage("staff");
}
</script>
</body>
</html>
